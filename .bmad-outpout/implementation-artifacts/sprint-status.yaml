#
# Epic Status Transitions:
#   - backlog → in-progress: automatiquement à la création de la première story
#   - in-progress → done: manuellement quand toutes les stories sont 'done'
#
# Story Status:
#   - backlog: la story n'existe que dans le fichier epics
