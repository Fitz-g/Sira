name: sira
description: Planification et simulation financière personnelle — zone UEMOA.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # État & injection de dépendances
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Backend
  supabase_flutter: ^2.8.1

  # Stockage local
  flutter_secure_storage: ^9.2.2   # Sessions JWT (Keychain / Keystore)
  drift: ^2.34.3                   # Base SQLite locale — offline-first
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.0

  # Formatage (FCFA, dates fr-FR)
  intl: ^0.19.0

  # Icônes — jeu cohérent, remplace les emojis
  lucide_icons_flutter: ^3.0.0

  # Graphiques (projections, historiques BRVM)
  fl_chart: ^0.69.2

  # Monitoring
  sentry_flutter: ^9.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Génération de code — drift uniquement.
  # riverpod_generator a été retiré : les providers sont écrits à la main, et
  # l'analyzer qu'il embarquait ne supportait pas la version du SDK Dart.
  build_runner: ^2.16.0
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # Inter, police variable — un seul fichier couvre toutes les graisses,
  # du Thin au Black. Embarquée et non téléchargée : l'app doit fonctionner
  # hors connexion (NFR-R2).
  # Licence SIL Open Font, texte intégral dans assets/fonts/OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
